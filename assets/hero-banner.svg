<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280">
<defs>
  <clipPath id="frame"><rect width="960" height="280" rx="14"/></clipPath>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#060918"/><stop offset="0.6" stop-color="#0a0f24"/><stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <radialGradient id="aur1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="aur2"><stop offset="0" stop-color="#a855f7" stop-opacity="0.5"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
  <radialGradient id="aur3"><stop offset="0" stop-color="#f472b6" stop-opacity="0.35"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
  <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="960" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="0.25" stop-color="#818cf8"/><stop offset="0.5" stop-color="#c084fc"/><stop offset="0.75" stop-color="#f472b6"/><stop offset="1" stop-color="#22d3ee"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="960 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="hgrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.28"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="uline" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="42"/></filter>
</defs>
<style>
  .tw0{animation:tw 2.6s ease-in-out infinite}
  .tw1{animation:tw 3.4s ease-in-out infinite}
  .tw2{animation:tw 4.4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
  .b1{animation:d1 13s ease-in-out infinite alternate}
  .b2{animation:d2 16s ease-in-out infinite alternate}
  .b3{animation:d3 11s ease-in-out infinite alternate}
  @keyframes d1{to{transform:translate(70px,24px)}}
  @keyframes d2{to{transform:translate(-80px,-20px)}}
  @keyframes d3{to{transform:translate(50px,30px)}}
  .scroll{animation:sc 3.2s linear infinite}
  @keyframes sc{to{transform:translateY(-14px)}}
  .runner{animation:run 2.6s ease-in-out infinite alternate}
  @keyframes run{from{transform:translateX(0)}to{transform:translateX(150px)}}
  .float0{animation:fl 5s ease-in-out infinite alternate}
  .float1{animation:fl 6.5s ease-in-out infinite alternate}
  .float2{animation:fl 4.2s ease-in-out infinite alternate}
  @keyframes fl{to{transform:translateY(-10px)}}
  .spin{transform-origin:906px 42px;animation:sp 9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:Consolas,Monaco,monospace}
</style>
