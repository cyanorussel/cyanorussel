<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280">
<defs>
  <clipPath id="frame"><rect width="960" height="280" rx="14"/></clipPath>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <radialGradient id="aur1"><stop offset="0" stop-color="#1f6feb" stop-opacity="0.16"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/></radialGradient>
  <radialGradient id="aur2"><stop offset="0" stop-color="#388bfd" stop-opacity="0.11"/><stop offset="1" stop-color="#388bfd" stop-opacity="0"/></radialGradient>
  <linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f0f4fa"/><stop offset="1" stop-color="#b6c7e3"/>
  </linearGradient>
  <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="uline" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1f6feb"/><stop offset="1" stop-color="#58a6ff"/>
  </linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.2" cy="1.2" r="1.2" fill="#30363d" opacity="0.5"/>
  </pattern>
  <mask id="nameMask">
    <text x="480" y="136" text-anchor="middle" font-size="62" font-weight="700" letter-spacing="2"
          font-family="'Segoe UI',Helvetica,Arial,sans-serif" fill="#ffffff">ANMOL RAJ VERMA</text>
  </mask>
</defs>
<style>
  .tw0{animation:tw 3.2s ease-in-out infinite}
  .tw1{animation:tw 4.1s ease-in-out infinite}
  .tw2{animation:tw 5.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.08}50%{opacity:.5}}
  .b1{animation:d1 16s ease-in-out infinite alternate}
  .b2{animation:d2 19s ease-in-out infinite alternate}
  @keyframes d1{to{transform:translate(60px,18px)}}
  @keyframes d2{to{transform:translate(-70px,-14px)}}
  .sheen{animation:sh 7s ease-in-out infinite}
  @keyframes sh{0%{transform:translateX(-520px)}55%{transform:translateX(520px)}100%{transform:translateX(520px)}}
  .runner{animation:run 3.2s ease-in-out infinite alternate}
  @keyframes run{from{transform:translateX(0)}to{transform:translateX(116px)}}
  text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
</style>
<g clip-path="url(#frame)">
  <rect width="960" height="280" fill="url(#bg)"/>
  <rect width="960" height="280" fill="url(#dots)"/>
  <ellipse class="b1" cx="200" cy="70" rx="300" ry="130" fill="url(#aur1)"/>
  <ellipse class="b2" cx="770" cy="220" rx="320" ry="140" fill="url(#aur2)"/>
  <circle class="tw0" cx="893" cy="38" r="0.9" fill="#cdd9e5" style="animation-delay:1.0s"/><circle class="tw1" cx="896" cy="125" r="1.2" fill="#cdd9e5" style="animation-delay:2.1s"/><circle class="tw2" cx="902" cy="100" r="0.8" fill="#cdd9e5" style="animation-delay:4.9s"/><circle class="tw0" cx="690" cy="139" r="1.2" fill="#cdd9e5" style="animation-delay:1.0s"/><circle class="tw1" cx="702" cy="59" r="0.9" fill="#cdd9e5" style="animation-delay:2.9s"/><circle class="tw2" cx="405" cy="158" r="0.7" fill="#cdd9e5" style="animation-delay:2.9s"/><circle class="tw0" cx="660" cy="76" r="1.0" fill="#cdd9e5" style="animation-delay:4.2s"/><circle class="tw1" cx="551" cy="56" r="1.1" fill="#cdd9e5" style="animation-delay:2.2s"/><circle class="tw2" cx="814" cy="84" r="1.1" fill="#cdd9e5" style="animation-delay:1.8s"/><circle class="tw0" cx="491" cy="20" r="1.2" fill="#cdd9e5" style="animation-delay:2.8s"/><circle class="tw1" cx="229" cy="107" r="1.3" fill="#cdd9e5" style="animation-delay:4.9s"/><circle class="tw2" cx="787" cy="25" r="0.8" fill="#cdd9e5" style="animation-delay:0.5s"/><circle class="tw0" cx="849" cy="28" r="1.0" fill="#cdd9e5" style="animation-delay:2.8s"/><circle class="tw1" cx="433" cy="138" r="0.9" fill="#cdd9e5" style="animation-delay:3.9s"/><circle class="tw2" cx="364" cy="129" r="0.8" fill="#cdd9e5" style="animation-delay:0.5s"/><circle class="tw0" cx="384" cy="57" r="0.7" fill="#cdd9e5" style="animation-delay:2.2s"/><circle class="tw1" cx="247" cy="136" r="0.7" fill="#cdd9e5" style="animation-delay:3.0s"/><circle class="tw2" cx="244" cy="79" r="0.8" fill="#cdd9e5" style="animation-delay:2.7s"/>
  <text x="480" y="136" text-anchor="middle" font-size="62" font-weight="700" letter-spacing="2"
        fill="url(#nameGrad)">ANMOL RAJ VERMA</text>
  <g mask="url(#nameMask)">
    <rect class="sheen" x="180" y="70" width="240" height="80" fill="url(#sheenGrad)" transform="skewX(-18)"/>
  </g>
  <text x="480" y="177" text-anchor="middle" font-size="15" letter-spacing="5" fill="#9db2d6"
        font-weight="600">FULL STACK DEVELOPER · AI ENTHUSIAST · CSE @ NIT AGARTALA</text>
  <rect x="418" y="192" width="124" height="2.5" rx="1.25" fill="url(#uline)" opacity="0.85"/>
  <rect class="runner" x="418" y="192" width="8" height="2.5" rx="1.25" fill="#cde3ff" opacity="0.9"/>
  <rect x="0.75" y="0.75" width="958.5" height="278.5" rx="13.5" fill="none" stroke="#30363d" stroke-width="1.5"/>
</g>
</svg>